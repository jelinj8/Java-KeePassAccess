# Builds the Java client and the KeePass plugin on every push and pull request. On a v* tag it also creates a
# GitHub Release with KeePassAccess.dll and the client jar attached. Maven Central is deployed locally
# (mvn deploy -P release), since signing needs the GPG key.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Java client
        working-directory: java
        run: mvn -B --no-transfer-progress clean verify

      # The plugin compiles against KeePass.exe; Chocolatey installs it to the default path build.bat expects.
      - name: Install KeePass
        run: choco install keepass -y --no-progress

      - name: Build plugin
        shell: cmd
        run: plugin\build.bat

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir dist
          cp plugin/out/KeePassAccess.dll dist/
          cp java/target/keepass-access-*.jar dist/

      - uses: actions/upload-artifact@v6
        with:
          name: keepass-access
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: keepass-access
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
