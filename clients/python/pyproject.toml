[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keepass-access"
version = "1.4.0.dev0"
description = "Client for the KeePassAccess KeePass plugin, with an MCP server that lets AI assistants use shared entries without seeing their values."
readme = "README.md"
license = "LGPL-2.1-only"
authors = [{ name = "Jakub Jelínek", email = "jakub.jelinek@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
keepass-access-mcp = "keepass_access.mcp_server:main"

[project.urls]
Homepage = "https://github.com/jelinj8/Java-KeePassAccess"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
